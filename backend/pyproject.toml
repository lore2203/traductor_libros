[project]
name = "traductor-libros"
version = "0.1.0"
description = "Traducción de libros PDF EN→ES preservando la maquetación"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pymupdf-fonts",
  "pypdf",
  "pdfplumber",
  "pillow",
  "fonttools",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "sqlalchemy>=2.0",
  "alembic",
  "pydantic-settings",
  "httpx",
  "tenacity",
  "pytesseract",
  "opencv-python-headless",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: pruebas con el PDF de referencia (lentas, pueden usar la API)"]
