services:
  api:
    build: ./backend
    image: traductor-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/app.db
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  worker:
    image: traductor-backend
    command: sh -c "sleep 3 && python -m app.worker"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/app.db
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
